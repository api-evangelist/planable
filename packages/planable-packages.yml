summary:
  official_sdk_count: 0
  official_package_count: 1
  finding: >-
    Planable ships NO first-party client library in any language registry. Its own API guide
    hands the developer a bearer token, the base URL and the OpenAPI 3.1 document at
    /api/v1/openapi.json, explicitly framing generation/import ("imports directly into Postman,
    Insomnia, or any API client") as the integration path instead of an SDK. The one first-party
    distributed package is an agent artifact, not an HTTP client: the `planable-smm` Claude Code
    plugin published from the provider's own GitHub org.
