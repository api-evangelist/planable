    type: has_many
    via: workspaceId
  - from: Workspace
    to: Member
    type: has_many
    via: workspaceId
  - from: Post
    to: Page
    type: belongs_to
    via: pageId
  - from: Post
    to: Page
    type: has_many
    via: pageIds
    note: A grouped cross-platform post fans out to several pages and shares one groupId.
  - from: Post
    to: Campaign
    type: belongs_to
    via: campaignId
    optional: true
  - from: Post
    to: Comment
    type: has_many
    via: postId
  - from: Post
    to: Media
    type: has_many
    via: media attachments (up to 10)
  - from: Post
    to: Label
    type: has_many
    via: label assignment
  - from: Comment
    to: Comment
    type: belongs_to
    via: replyToCommentId
    optional: true
  - from: Page
    to: TrackedCompetitor
    type: has_many
    via: path parent /pages/{id}/competitors
    cap: 5
  - from: Keyword
    to: Mention
    type: has_many
    via: path parent /keywords/{keywordId}/mentions
  - from: Story
    to: Page
    type: belongs_to
    via: pageId
  - from: Story
    to: Media
    type: has_many
    via: mediaId

traversal_notes:
  - Almost every collection requires `workspaceId` as a query parameter — workspace is the mandatory scoping key, not an optional filter.
  - There is no /companies operation, so an agent starting cold over REST must begin at GET /workspaces. Over MCP, list_workspaces plays the same role.
  - Metrics for pages and posts are separate sub-resources, and both follow trigger-then-poll sync.
