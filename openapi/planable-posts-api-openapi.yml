  /posts/{id}/sync:
    post:
      tags:
      - Posts
      summary: Trigger post metrics sync
      description: Triggers a fresh metrics sync for a published post.
      security:
      - bearerAuth:
        - write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Post metrics sync queued or deduplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                      started:
                        type: boolean
                      message:
                        type: string
