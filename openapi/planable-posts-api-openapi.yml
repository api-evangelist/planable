    delete:
      tags:
      - Posts
      summary: Delete a post
      description: Deletes a post in a workspace accessible to the calling token.
      security:
      - bearerAuth:
        - write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Post deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: Post not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Posts
      summary: Update a post
      description: 'Updates a post. Published posts are immutable and will return 400. The `media` field:
        Up to 20 public image or video URLs, each max 100MB. Files are downloaded server-side from the
        provided URLs. Pass an empty array to clear media. Stories support a single, non-GIF media item;
        submitting multiple media URLs or a GIF for a story returns 400. Set `archived` to `true` to archive
        a post or `false` to restore it; archiving removes any active schedule. Use `videoThumbnail` to
        set a custom video thumbnail (cover) from an image URL or from a video frame offset; the post
        must have a fully transcoded video (the first video is used for mixed media). Set `notify` to
        `false` to suppress notifications (email/in-app push, Zapier) for the edit activities created
        by this update; internal activity feed entries are always recorded. `notify` modifies nothing
        by itself, so it does not count towards the at-least-one-field requirement. It is not an approval
        request — use POST /posts/{id}/request-approval to notify approvers.'
      security:
      - bearerAuth:
        - write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 25000
                scheduledAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                labels:
                  type: array
                  items:
                    type: string
                media:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 20
                  description: Up to 20 public image or video URLs, each max 100MB. Files are downloaded
                    server-side from the provided URLs.
                teamOnly:
                  type: boolean
                approved:
                  type: boolean
                approvedBy:
                  type: string
                  minLength: 1
                linkedinPdfTitle:
                  type: string
                  maxLength: 150
                  description: LinkedIn PDF carousel title (`linkedinData.pdfTitle`). When set on a LinkedIn
                    post with multiple images, also enables publishing as a PDF document carousel (`linkedinData.publishCarouselAsPdf`).
                    Pass an empty string on PATCH to disable PDF mode and clear the title.
                linkedinVideoTitle:
                  type: string
                  maxLength: 150
                pinterest:
                  type: object
                  properties:
                    boardId:
                      type: string
                      minLength: 1
                    title:
                      type: string
                      maxLength: 100
                    link:
                      type: string
                      format: uri
                    description:
                      type: string
                      maxLength: 500
                publishAtScheduledDate:
                  type: boolean
                archived:
                  type: boolean
                campaignId:
                  anyOf:
                  - type: string
                    minLength: 1
                  - type: 'null'
                  - type: 'null'
                notify:
                  type: boolean
                  description: When false, the edit activities created by this update do not trigger notifications
