  /posts/{id}/comments/{commentId}/reactions:
    post:
      tags:
      - Posts
      summary: Toggle a reaction on a comment
      description: 'Adds the token user emoji reaction to a comment. Toggle semantics: sending the same
        emoji again removes the reaction. Returns the updated reactions of the comment.'
      security:
      - bearerAuth:
        - write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  minLength: 1
                emojiId:
                  type: string
                  minLength: 1
                emojiSkin:
                  anyOf:
                  - type: number
                    enum:
                    - 0
                  - type: number
                    enum:
                    - 1
                  - type: number
                    enum:
                    - 2
                  - type: number
                    enum:
                    - 3
                  - type: number
                    enum:
                    - 4
                  - type: number
                    enum:
                    - 5
                  - type: number
                    enum:
                    - 6
                emojiNative:
                  type: string
                  minLength: 1
              required:
              - emoji
              - emojiId
              - emojiSkin
              - emojiNative
      responses:
        '200':
          description: Updated reactions of the comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reactions:
                        type: array
                        items:
                          type: object
                          properties:
                            emoji:
                              type: string
                            emojiId:
                              type: string
                            emojiSkin:
                              type: integer
                            emojiNative:
                              type: string
                            users:
                              type: array
                              items:
                                type: object
                                properties:
                                  userId:
                                    type: string
                                  userName:
                                    type: string
                                  createdAt:
                                    type: string
                                    format: date-time
                                required:
                                - userId
                          required:
                          - emoji
                          - emojiId
                          - emojiSkin
                          - emojiNative
                          - users
                    required:
                    - reactions
                required:
                - data
        '400':
          description: Validation error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post or comment not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pln_*
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - METHOD_NOT_ALLOWED
              - RATE_LIMITED
              - POST_ALREADY_PUBLISHED
              - PUBLISHING_IN_PROGRESS
              - WORKSPACE_LIMIT_REACHED
              - INTERNAL
            message:
              type: string
            requestId:
              type: string
          required:
          - code
          - message
          - requestId
      required:
      - error
