                    required:
                    - id
                    - workspaceId
                    - name
                    - status
                    - icon
                    - color
                    - startedAt
                    - endedAt
                    - links
                    - createdAt
                required:
                - data
        '400':
          description: Validation error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Campaign limit reached or insufficient permissions
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /campaigns/{id}:
    get:
      tags:
      - Campaigns
      summary: Get campaign detail
      description: Returns a single campaign by ID.
