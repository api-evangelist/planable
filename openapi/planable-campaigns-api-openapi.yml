                  - barrier
                  - paint
                  - bolt
                  - heart
                  - babyCarriage
                  - trophy
                  - award
                  - paw
                  - bone
                  - creditCard
                  - discount
                  - shield
                  - tag
                  - thumbUp
                  - thumbDown
                  - umbrella
                  - flag
                  - sun
                  - campfire
                  - seeding
                  - leaf
                  - cherry
                  - macro
                  - clover
                  - pumpkin
                  - flame
                  - cactus
                  - globe
                  - stack
                  - basketball
                  - baseball
                  - ball
                  - gasPump
                  - car
                  - balloon
                  - mug
                  - location
                  - analyze
                  - chartPie
                  - chartDots
                  - cards
                  - mail
                  - headphones
                  - microphone
                  - key
                color:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                endedAt:
                  type: string
                  format: date-time
                description:
                  type: string
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        minLength: 1
                      title:
                        type: string
                    required:
                    - url
              required:
              - workspaceId
              - name
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      workspaceId:
                        type: string
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                        - active
                        - archived
                        - paused
