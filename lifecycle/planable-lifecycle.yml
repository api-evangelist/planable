changelog:
  url: https://changelog.planable.io/
  dated: false
  detail: changelog/planable-changelog.yml
  note: >-
    Entries are ordered newest-first and labelled New / Improvement, but the public changelog
    renders no publication date on the entry list — an agent cannot compute recency from it.

sla:
