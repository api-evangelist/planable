versioning:
  scheme: url-path
  current_version: v1
  spec_version: 1.0.0
  base: https://api.planable.io/api/v1
  published_statement: '"The API is versioned, all endpoints live under /api/v1"'
  older_versions_served: none
  note: >-
    A changelog entry headlined "MCP and API v2" announces new capability areas (campaigns,
    custom views, competitor analytics) but no /api/v2 path is served and info.version is still
    1.0.0. Treat "v2" there as a product-release label, not an API version.

deprecation:
  policy_published: false
  detail: >-
    Planable publishes no deprecation or sunset policy, no notice period, and no migration
    commitment for the Public API. The spec declares `deprecated: true` on zero of its 51
    operations, and neither the Deprecation nor the Sunset header (RFC 8594) appears anywhere
    in the contract or the docs. This is a real gap, not an omission on our side.
  deprecated_operations: []
  sunset_header: not implemented
  deprecation_header: not implemented

