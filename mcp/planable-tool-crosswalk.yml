  - tool: create_label
    category: content
    rest: ["POST /labels"]
    binding: direct
    confidence: high
  - tool: list_posts
    category: content
    rest: ["GET /posts", "GET /posts/count"]
    binding: direct
    confidence: high
    note: >-
      The skills call list_posts with an approvalStatus filter
      (PENDING_MY_APPROVAL / NOT_APPROVED / PARTIAL_APPROVED / REQUESTED_BY_ME).
      GET /posts publishes a `status` query parameter; the approval-status filter is not
      visible in the public spec, so that dimension may be MCP-only.
  - tool: create_post
    category: content
    rest: ["POST /posts"]
    binding: direct
    confidence: high
  - tool: create_grouped_post
    category: content
    rest: ["POST /posts"]
    binding: composite
    confidence: high
    note: >-
      Planable's own API guide states a grouped cross-platform post is created by passing
      multiple `pageIds` to the single create operation, so this tool is a shaped call on
      POST /posts rather than a distinct endpoint.
  - tool: update_post
    category: content
    rest: ["PATCH /posts/{id}"]
    binding: direct
    confidence: high
  - tool: create_comment
    category: collaboration
    rest: ["POST /posts/{id}/comments"]
    binding: direct
    confidence: high
  - tool: approve_post
    category: approvals
    rest: []
    binding: none
    confidence: high
    note: >-
      No public REST operation approves a post. The closest published operation is
      POST /posts/{id}/request-approval, which SENDS a post for approval — the opposite
      direction. Approval is an MCP-only capability in the current contracts.
  - tool: get_page_metrics
    category: analytics
    rest: ["GET /pages/{id}/metrics"]
    binding: direct
    confidence: high
  - tool: get_page_metrics_summary
    category: analytics
    rest: ["GET /pages/{id}/metrics"]
    binding: composite
    confidence: medium
    note: Documented as "aggregated metrics across all pages in a workspace" — a fan-out over the per-page operation.
  - tool: get_post_metrics
    category: analytics
    rest: ["GET /posts/{id}/metrics"]
    binding: direct
    confidence: high
  - tool: get_post_metrics_summary
    category: analytics
    rest: ["GET /posts/{id}/metrics"]
    binding: composite
    confidence: medium
  - tool: refresh_page_metrics
    category: analytics
    rest: ["POST /pages/{id}/sync", "GET /pages/{id}/sync-status"]
    binding: composite
    confidence: high
    note: The REST pattern is trigger-then-poll; the tool presents it as one refresh action.

mcp_only:
  - tool: approve_post
    reason: No public REST approve operation exists; REST can only request approval.
  - tool: (reject / disapprove)
    reason: >-
      Documented in the MCP capability map ("Reject and disapprove posts that need revisions")
      with no corresponding public REST operation and no tool name published in the skills.
  - tool: (list companies)
    reason: >-
      "List all companies and workspaces you belong to" is a documented MCP capability;
      the public REST API exposes no /companies collection.
  - tool: (list workspace members)
    reason: >-
      GET /members exists in REST, but no member-listing tool name appears in the published
      skills — the capability is documented for MCP without a verified tool name.

