generated: '2026-08-13'
method: derived
source: >-
  mcp/planable-mcp.yml (tool names read verbatim from Planable's own published Agent Skills)
  bound against openapi/_original/planable-openapi.json (Planable Public API v1, 51 operations)
note: >-
  The published OpenAPI declares NO operationId on any of its 51 operations, so the `rest:` rows
  below identify operations by "METHOD /path" — the only stable identifier the provider publishes.
  overlays/ assigns candidate operationIds as an API Evangelist enhancement; those are ours, not
  Planable's, and are listed under `overlay_operation_id` where one exists.
  The live MCP tools/list is OAuth-gated (401 invalid_token), so bindings are by name and
  documented semantics rather than by observed inputSchema — confidence is set accordingly.

surfaces:
  openapi:
    file: openapi/_original/planable-openapi.json
    servers: https://api.planable.io/api/v1
    operations: 51
    gated: false
    note: Spec is anonymously readable; calling it requires a pln_ bearer token (Pro/Enterprise plans).
  mcp:
    url: https://mcp.planable.io/mcp
    gated: true
    note: OAuth 2.0 protected resource; tools/list returns 401 without a token.
  graphql:
    present: false

crosswalk:
  - tool: list_workspaces
    category: account-structure
    rest: ["GET /workspaces"]
    binding: direct
    confidence: high
  - tool: get_workspace_details
    category: account-structure
    rest: ["GET /workspaces"]
    binding: partial
    confidence: medium
    note: >-
      REST exposes only a workspace list. The MCP tool additionally reports which add-ons
      (Analytics, Social Inbox) are active on a workspace — no public REST operation returns that.
  - tool: list_pages
    category: account-structure
    rest: ["GET /pages"]
    binding: direct
    confidence: high
  - tool: list_labels
